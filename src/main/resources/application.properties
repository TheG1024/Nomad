# Server Configuration
server.port=8080

# Redis Configuration
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.database=0
spring.data.redis.repositories.enabled=false
app.redis.fallback.enabled=true

# Logging Configuration
logging.level.com.gpstracker=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Security Configuration (to be enhanced with proper security measures)
spring.security.user.name=admin
spring.security.user.password=admin

# OpenWeatherMap API Key

# Spring Configuration
spring.main.allow-bean-definition-overriding=true
spring.profiles.active=embedded

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Static Resource Mapping
spring.web.resources.static-locations=classpath:/static/,classpath:/public/,classpath:/resources/,classpath:/META-INF/resources/
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false
spring.mvc.static-path-pattern=/**
