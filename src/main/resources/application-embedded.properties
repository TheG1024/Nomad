# Embedded Mode Profile (No Redis)
# This profile runs the application with in-memory implementations instead of Redis

# Disable Redis entirely
spring.data.redis.repositories.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# Use in-memory caching instead
spring.cache.type=simple

# Logging Configuration
logging.level.com.gpstracker=DEBUG

# Security Configuration 
spring.security.user.name=admin
spring.security.user.password=admin

# OpenWeatherMap API Key
openweathermap.api.key=your-api-key-here

# Allow bean definition overriding
spring.main.allow-bean-definition-overriding=true

# Server settings
server.port=8080
server.servlet.context-path=/ 