<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GPS Tracker - Offline</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      background-color: #f8f9fa;
      color: #343a40;
      text-align: center;
    }
    .container {
      max-width: 600px;
      padding: 30px;
      background-color: white;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    h1 {
      margin-top: 0;
      color: #007bff;
    }
    .icon {
      font-size: 64px;
      margin-bottom: 20px;
      color: #6c757d;
    }
    .message {
      margin-bottom: 30px;
      line-height: 1.5;
    }
    .retry-button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      transition: background-color 0.3s;
    }
    .retry-button:hover {
      background-color: #0069d9;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>You're Offline</h1>
    <div class="message">
      <p>GPS Tracker requires an internet connection to function properly.</p>
      <p>Your location data is being stored and will be synchronized once you're back online.</p>
    </div>
    <button class="retry-button" onclick="window.location.reload()">Try Again</button>
  </div>
  <script>
    // Check for connectivity changes
    window.addEventListener('online', () => {
      window.location.reload();
    });
  </script>
</body>
</html>
